
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
      // Prevent third-party browser extension and script crashes (e.g. TronLink) from bubbling up
      window.addEventListener('error', function(e) {
        var msg = e.message || (e.error && e.error.message) || '';
        if (msg.indexOf('tronlinkParams') !== -1 || msg.indexOf('tronLink') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || '';
        var msg = typeof reason === 'string' ? reason : (reason.message || '');
        if (msg.indexOf('tronlinkParams') !== -1 || msg.indexOf('tronLink') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroMap Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f8fafc; }
        #root { height: 100vh; width: 100vw; }
        /* Custom scrollbars for the board */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        .zoom-in { animation: zoomIn 0.2s ease-out; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script>
      // Automatically refresh lucide icons if content changes
      const observer = new MutationObserver(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
